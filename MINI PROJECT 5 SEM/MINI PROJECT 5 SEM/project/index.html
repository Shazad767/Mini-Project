<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elite Dine – Welcome</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Georgia", serif;
            background: url('https://images.unsplash.com/photo-1498654896293-37aacf113fd9?auto=format&fit=crop&w=1400&q=80')
                        no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.45);
            top: 0;
            left: 0;
        }

        .content {
            position: relative;   /* important so it appears above overlay */
            z-index: 10;
            text-align: center;
            color: white;
        }

        h1 {
            font-size: 48px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .btn {
            padding: 12px 30px;
            background: #d4a059;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn:hover {
            background: #b9863f;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="content">
    <h1>Elite Dine</h1>
    <p>Classic • Elegant • Digital Food Ordering</p>

    <button class="btn" onclick="location.href='menu.html'">
        Get Started
    </button>
</div>

</body>
</html>
